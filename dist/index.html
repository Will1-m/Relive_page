<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Relive — catálogo de accesorios, informática y servicio técnico." />
        <title>Relive — Catálogo</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="css/styles.css" rel="stylesheet" />
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand relive-brand fw-bold" href="index.html" aria-label="Relive, inicio">
                    <img class="relive-logo" src="assets/logo.webp" alt="Relive" />
                    <span class="visually-hidden">RELIVE</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="nav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link active" href="index.html">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link" href="#categorias-nav">Categorías</a></li>
                        <li class="nav-item"><a class="nav-link" href="#ofertas-panel">Ofertas</a></li>
                    </ul>
                    <a class="nav-link text-white" href="cart.html">
                        Carrito (
                        <span class="relive-cart-count">0</span>
                        )
                    </a>
                </div>
            </div>
        </nav>
        <header class="bg-dark text-white py-5">
            <div class="container">
                <h1 class="display-5 fw-bold">Catálogo Relive</h1>
                <p class="lead mb-0">Accesorios, informática y productos disponibles.</p>
            </div>
        </header>
        <main class="container py-4">
            <div class="row g-3 mb-4">
                <div class="col-lg-6">
                    <label class="form-label" for="buscador">Buscar</label>
                    <div class="search-field">
                        <div class="input-group">
                            <input class="form-control" id="buscador" type="search" placeholder="Producto, código, marca…" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="sugerencias-busqueda" aria-expanded="false" />
                            <button class="btn btn-dark" id="buscar-btn" type="button">Buscar</button>
                        </div>
                        <div class="search-suggestions" id="sugerencias-busqueda" role="listbox" hidden></div>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-2">
                    <label class="form-label" for="filtro-marca">Marca</label>
                    <select class="form-select" id="filtro-marca">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="col-sm-6 col-lg-2">
                    <label class="form-label" for="orden">Ordenar</label>
                    <select class="form-select" id="orden">
                        <option value="relevancia">Relevancia</option>
                        <option value="precio-asc">Precio menor</option>
                        <option value="precio-desc">Precio mayor</option>
                        <option value="nombre">Nombre</option>
                    </select>
                </div>
                <div class="col-sm-6 col-lg-2 d-flex align-items-end"><a class="btn btn-outline-dark w-100" href="cart.html">Ver carrito</a></div>
            </div>
            <section class="offer-panel mb-4" id="ofertas-panel" aria-labelledby="ofertas-titulo">
                <div class="offer-panel-content">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                        <div>
                            <span class="offer-kicker">Selección de temporada</span>
                            <h2 class="h3 mb-1" id="ofertas-titulo">Ofertas por marca</h2>
                            <p class="mb-0" id="ofertas-info">Buscando promociones disponibles…</p>
                        </div>
                        <button class="btn btn-outline-light" id="limpiar-ofertas" type="button" hidden>Ver ofertas en catálogo</button>
                    </div>
                    <div class="offer-carousel mt-4">
                        <div class="offer-products row g-3" id="ofertas-productos"></div>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <button class="btn btn-sm btn-outline-light" id="ofertas-anterior" type="button" aria-label="Oferta anterior">←</button>
                            <div class="offer-pagination d-flex gap-2" id="ofertas-paginacion" aria-label="Paginación de ofertas"></div>
                            <button class="btn btn-sm btn-outline-light" id="ofertas-siguiente" type="button" aria-label="Oferta siguiente">→</button>
                        </div>
                    </div>
                    <div class="offer-brands d-flex flex-wrap gap-2 mt-3" id="ofertas-marcas"></div>
                </div>
            </section>
            <div class="d-flex flex-wrap gap-2 mb-3" id="categorias-nav"></div>
            <div class="d-flex flex-wrap gap-2 mb-4" id="subcategorias-nav"></div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <p class="text-muted mb-0" id="resultado-info">Cargando catálogo…</p>
                <select class="form-select form-select-sm" id="por-pagina" style="width: auto">
                    <option value="24">24 por página</option>
                    <option value="48">48 por página</option>
                    <option value="96">96 por página</option>
                </select>
            </div>
            <div class="row g-4" id="grid-productos"></div>
            <nav class="mt-4" aria-label="Paginación"><ul class="pagination justify-content-center flex-wrap" id="paginacion"></ul></nav>
        </main>
        <footer class="bg-dark text-white py-4 mt-5">
            <div class="container"><p class="mb-0 text-center">© 2026 Relive · Pinamar, Canelones, Uruguay</p></div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/scripts.js"></script>
    </body>
</html>
